
name: Auto Shorts Factory
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours automatically
  workflow_dispatch: # You can also press "Run" button from phone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          pip install requests openai moviepy gTTS pexels_api
          python generate.py
      - uses: actions/upload-artifact@v3
        with:
          name: generated-shorts
          path: ./output/
