name: Milo Pip 12 Per Day FREE
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core imagemagick
          # REMOVE google-generativeai completely - it's dead
          pip install Pillow==11.1.0 gTTS moviepy==1.0.3 numpy requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
          pip install --upgrade google-genai

      - name: Generate + Upload
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python generate.py

      - name: Save Backup
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: short.mp4
